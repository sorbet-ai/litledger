[project]
name = "litledger"
version = "0.1.0"
description = "Self-hosted literature ledger for AI agents: capture, tag, read and cite papers with provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "httpcore>=1.0",
    "rapidfuzz>=3.9",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pylatexenc>=2.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
litledger = "litledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litledger"]
# The built web UI is git-ignored but belongs in the wheel.
artifacts = ["src/litledger/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs (run with -m live)"]
addopts = "-m 'not live'"
